version: '3.8'

services:
  quantum-db:
    image: mysql:8.0
    container_name: quantum-wallet-db
    environment:
      MYSQL_DATABASE: quantum_wallet_db
      MYSQL_USER: quantum_user
      MYSQL_PASSWORD: quantum_password
      MYSQL_ROOT_PASSWORD: quantum_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: